name: Insurance Fraud MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run pytest
        run: python -m pytest -q tests/test_fraud_checks.py

      - name: Check Docker image build
        run: docker build -f Dockerfile.ci -t insurance-fraud-api-ci .